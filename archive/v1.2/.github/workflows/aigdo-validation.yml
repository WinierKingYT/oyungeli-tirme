name: AI Game Development OS Validation

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".claude/**"
      - ".ai-governance/**"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/aigdo-validation.yml"
  push:
    branches: [main, master]
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".claude/**"
      - ".ai-governance/**"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/aigdo-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate operating system
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/validate_os.py

